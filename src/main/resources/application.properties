spring.application.name=trading-simulator

server.port=${PORT}


spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.properties.hibernate.default_schema=trading_simulator

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Load local .env if present (KEY=value).
spring.config.import=optional:file:.env[.properties]

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Finnhub (initial real-world price seed only) ---
# Key supplied via environment variable FINNHUB_API_KEY
finnhub.enabled=true
finnhub.base-url=https://finnhub.io/api/v1
finnhub.api-key=${FINNHUB_API_KEY}
finnhub.fallback-price=100.0
# Free tier ~60 calls/min — delay between symbols on startup
finnhub.request-delay-ms=1100
finnhub.timeout-ms=5000

# --- Local GBM simulation (runs after Finnhub bootstrap) ---
market.simulation.tick-interval-ms=1000
market.simulation.default-drift=0.08
market.simulation.default-volatility=0.25
market.simulation.symbols=AAPL,TSLA,MSFT,AMZN,GOOGL,META,NVDA,NFLX,AMD,INTC
